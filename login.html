<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login Admin - RT 014 / RW 008</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>
  <body
    class="bg-gray-100 font-sans text-gray-800 flex items-center justify-center min-h-screen"
  >
    <!-- Card Form Login -->
    <div
      class="w-full max-w-md bg-white p-8 rounded-2xl shadow-sm border border-gray-200"
    >
      <div class="text-center mb-6">
        <div
          class="inline-block p-3 bg-emerald-100 text-emerald-600 rounded-full mb-3"
        >
          <i class="fa-solid fa-lock text-2xl"></i>
        </div>
        <h1 class="text-2xl font-bold text-gray-800">Login Admin RT</h1>
        <p class="text-xs text-gray-500 mt-1">
          Silakan masukkan akun administrator sistem
        </p>
      </div>

      <form id="formLogin" onsubmit="prosesLogin(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1"
            >Username</label
          >
          <div class="relative">
            <span
              class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400"
            >
              <i class="fa-solid fa-user"></i>
            </span>
            <input
              id="username"
              type="text"
              placeholder="Masukkan username"
              class="w-full text-sm pl-10 pr-3 py-2.5 rounded-lg border border-gray-300 focus:ring-2 focus:ring-emerald-500 focus:outline-none"
              required
            />
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1"
            >Password</label
          >
          <div class="relative">
            <span
              class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400"
            >
              <i class="fa-solid fa-key"></i>
            </span>
            <input
              id="password"
              type="password"
              placeholder="Masukkan password"
              class="w-full text-sm pl-10 pr-3 py-2.5 rounded-lg border border-gray-300 focus:ring-2 focus:ring-emerald-500 focus:outline-none"
              required
            />
          </div>
        </div>

        <button
          type="submit"
          class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2.5 rounded-lg text-sm transition shadow-sm"
        >
          Masuk
        </button>
      </form>

      <div class="text-center mt-6">
        <a
          href="index.html"
          class="text-xs text-emerald-600 hover:underline font-medium"
        >
          Kembali ke Beranda Warga
        </a>
        <br />
        <br />
        Tidak bisa login? Silahkan konfirmasi ke email rt14bersama@gmail.com
      </div>
    </div>

    <!-- Script Proses Login -->
    <script>
      // Jika sudah login, langsung lempar ke admin_2.html (atau admin.html)
      document.addEventListener("DOMContentLoaded", () => {
        if (localStorage.getItem("admin_logged_in") === "true") {
          window.location.href = "admin.html";
        }
      });

      async function prosesLogin(e) {
        e.preventDefault();

        const username = document.getElementById("username").value;
        const password = document.getElementById("password").value;

        try {
          const res = await fetch("api_login.php?action=login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username, password }),
          });

          const result = await res.json();

          if (result.success) {
            localStorage.setItem("admin_logged_in", "true");
            window.location.href = "admin.html";
          } else {
            alert("Gagal Login: " + result.message);
          }
        } catch (err) {
          console.error("Error:", err);
          alert("Terjadi kesalahan koneksi ke server.");
        }
      }
    </script>
  </body>
</html>
